server:
  port: 8080

spring:
  application:
    name: store-api
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      username: ${SPRING_REDIS_USERNAME}
      password: ${SPRING_REDIS_PASSWORD}
  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        spatial:
          database: POSTGIS

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

store-api:
  data:
    json:
      stores-info: db/data/stores.json
  openapi:
    dev-url: http://localhost:8080
    prod-url: http://localhost:8080
  jwt:
    secret: ENC(qVb3fQuZhYR+49zsVJNemM968Xri1xi+AvsQZFafjer1uEQyxNV3eNrIJQsCm8HwGaEgRt/o/JILrhJ75p2LdgpK/S79ZEk1njqYlA1BKcE=)
    expiration-in-milliseconds: 600000
  env:
    jasypt-encryptor-password: jasypt-itest
  security:
    cors-allowed-origins: http://localhost:8080,http://localhost:3000,https://jumbo-store-api-f1ae1b3de689.herokuapp.com,http://jumbo-store-api-f1ae1b3de689.herokuapp.com
