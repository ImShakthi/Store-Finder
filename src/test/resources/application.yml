server:
  port: 8080

spring:
  application:
    name: Store-Finder
  liquibase:
    enabled: true
    drop-first: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  #    default-schema:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:postgresql://localhost:5432/storefinder
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: root

store-finder:
  data:
    json:
      stores-info: db/data/stores.json
  openapi:
    dev-url: http://localhost:8080
    prod-url: http://localhost:8080
  jwt:
    secret: ENC(piKfYmhWClAPtJrkV+1KZ+y/d6Fs9UovXIXcjt+ZLlSEy0nEcIfhYWhdeXKxVWavfDQWxPVme3N9vbU7d6oNeHfHJyAE/GcYxqYlTHyHHXg=)
    expiration-in-milliseconds: 600000
  env:
    jasypt-encryptor-password: jasypt-itest
  security:
    cors-allowed-origins: http://localhost:8080,http://localhost:3000,https://cinemetrics-api-d21f2e62e3ca.herokuapp.com
